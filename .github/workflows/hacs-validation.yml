name: HACS Validation

on:
  # Disabled until the first GitHub Release is published.
  # push
  # pull_request
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@22.5.0
        with:
          category: "plugin"
